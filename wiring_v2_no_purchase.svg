<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><style>text{font-family:Arial,sans-serif;fill:#243447}.title{font-size:22px;font-weight:bold}.sub{font-size:13px;fill:#667085}.head{font-size:17px;font-weight:bold;fill:#1d4ed8}.arch{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}</style><rect width="1100" height="620" fill="#fff"/><text x="30" y="36" class="title">АРХИВ: вариант без ОУ и без силовой части 12V</text><text x="30" y="61" class="sub">Исторический прототип; не использовать как актуальную схему подключения</text><rect x="70" y="140" width="960" height="300" class="arch" rx="10"/><text x="105" y="190" class="head">Ранний вариант: делитель → GPIO34, GPIO25 → NPN + RC</text><text x="105" y="240">Он предполагал неподтверждённые питание и диапазоны сигналов.</text><text x="105" y="300">PAS и тормоз показаны только концептуально.</text><text x="105" y="350">Текущие схемы: full_schematic_mcp6002.svg и esp32_board_wiring.svg.</text><rect x="70" y="490" width="960" height="70" class="warn" rx="8"/><text x="95" y="530">Не подключать контроллер по этой схеме.</text></svg>