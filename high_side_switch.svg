<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><style>text{font-family:Arial,sans-serif;fill:#243447}.title{font-size:22px;font-weight:bold}.sub{font-size:13px;fill:#667085}.head{font-size:17px;font-weight:bold;fill:#1d4ed8}.arch{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}</style><rect width="1100" height="620" fill="#fff"/><text x="30" y="36" class="title">АРХИВ: ключ верхнего плеча P-MOSFET</text><text x="30" y="61" class="sub">Исторический вариант, не является текущей схемой GPIO ESP32</text><rect x="70" y="140" width="960" height="300" class="arch" rx="10"/><text x="105" y="190" class="head">+12V -> Source P-MOSFET -> нагрузка -> GND</text><text x="105" y="240">Gate подтянут к +12V резистором 10к; NPN стягивает Gate к GND.</text><text x="105" y="290">В старом варианте использовались Arduino D10/D9.</text><text x="105" y="340">Для текущей прошивки использовать light_sound_wiring.svg.</text><rect x="70" y="490" width="960" height="70" class="warn" rx="8"/><text x="95" y="530">Не повторять без проверки полярности, напряжения и тока нагрузки.</text></svg>