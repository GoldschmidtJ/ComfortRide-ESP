<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><style>text{font-family:Arial,sans-serif;fill:#243447}.title{font-size:22px;font-weight:bold}.sub{font-size:13px;fill:#667085}.head{font-size:17px;font-weight:bold;fill:#1d4ed8}.arch{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}</style><rect width="1100" height="620" fill="#fff"/><text x="30" y="36" class="title">АРХИВ: транзистор + RC вместо MCP6002</text><text x="30" y="61" class="sub">Сохранено для истории экспериментов; текущий выход — GPIO25 DAC → MCP6002</text><rect x="70" y="140" width="960" height="300" class="arch" rx="10"/><text x="105" y="190" class="head">GPIO25 → NPN → pull-up 4.7к → +5V</text><text x="105" y="240">C1 47–100 мкФ формирует аналоговый узел OUT; логика инвертирована.</text><text x="105" y="300">Вариант больше не соответствует актуальной аппаратной архитектуре.</text><text x="105" y="350">Для монтажа использовать full_schematic_mcp6002.svg.</text><rect x="70" y="490" width="960" height="70" class="warn" rx="8"/><text x="95" y="530">Не соединять выход ручки газа с входом контроллера напрямую.</text></svg>