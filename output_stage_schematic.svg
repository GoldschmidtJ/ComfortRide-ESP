<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" font-family="Arial, sans-serif">
  <rect width="820" height="640" fill="#ffffff"/>
  <text x="30" y="35" font-size="20" font-weight="bold">Принципиальная схема: выход газа (ESP32 -&gt; транзистор+RC -&gt; контроллер)</text>
  <text x="30" y="58" font-size="13" fill="#666">Единственный выход, который нужен прямо сейчас — остальное (PAS, вход, тормоз) без активных деталей.</text>

  <!-- +5V rail -->
  <line x1="80" y1="100" x2="700" y2="100" stroke="#c0392b" stroke-width="3"/>
  <text x="30" y="105" font-size="16" font-weight="bold" fill="#c0392b">+5В</text>

  <!-- GND rail -->
  <line x1="80" y1="560" x2="700" y2="560" stroke="#2c3e50" stroke-width="3"/>
  <text x="30" y="565" font-size="16" font-weight="bold" fill="#2c3e50">GND</text>

  <!-- R_pullup -->
  <line x1="500" y1="100" x2="500" y2="150" stroke="#333" stroke-width="2"/>
  <rect x="480" y="150" width="40" height="60" fill="none" stroke="#333" stroke-width="2"/>
  <text x="530" y="185" font-size="14" font-weight="bold">R1 = 4.7кОм</text>
  <text x="530" y="203" font-size="12" fill="#888">(подтяжка)</text>
  <line x1="500" y1="210" x2="500" y2="280" stroke="#333" stroke-width="2"/>

  <!-- узел OUT -->
  <circle cx="500" cy="280" r="5" fill="#c0392b"/>
  <text x="440" y="265" font-size="14" font-weight="bold" fill="#c0392b">УЗЕЛ "OUT"</text>
  <line x1="500" y1="280" x2="650" y2="280" stroke="#c0392b" stroke-width="3"/>
  <text x="655" y="275" font-size="14" fill="#c0392b">-&gt; провод к контроллеру</text>
  <text x="655" y="293" font-size="14" fill="#c0392b">(вход газа, было от ручки)</text>

  <!-- C_filter -->
  <line x1="500" y1="280" x2="500" y2="340" stroke="#333" stroke-width="2"/>
  <text x="520" y="365" font-size="14" font-weight="bold">C1 = 47-100мкФ</text>
  <text x="520" y="382" font-size="12" fill="#888">(электролитический,</text>
  <text x="520" y="397" font-size="12" fill="#888">"-" на землю!)</text>
  <line x1="475" y1="350" x2="525" y2="350" stroke="#333" stroke-width="4"/>
  <line x1="475" y1="360" x2="525" y2="360" stroke="#333" stroke-width="1"/>
  <text x="460" y="345" font-size="12">+</text>
  <line x1="500" y1="360" x2="500" y2="420" stroke="#333" stroke-width="2"/>

  <!-- Transistor -->
  <line x1="500" y1="280" x2="420" y2="340" stroke="#333" stroke-width="2"/>
  <text x="425" y="335" font-size="12">коллектор (к)</text>
  <circle cx="400" cy="360" r="40" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="365" y="357" font-size="15" font-weight="bold" fill="#27ae60">VT1</text>
  <text x="355" y="375" font-size="12" fill="#27ae60">2N2222 / BC547</text>
  <text x="355" y="390" font-size="11" fill="#27ae60">(любой NPN)</text>

  <line x1="400" y1="400" x2="400" y2="500" stroke="#333" stroke-width="2"/>
  <text x="405" y="490" font-size="12">эмиттер (э)</text>
  <line x1="400" y1="500" x2="400" y2="560" stroke="#333" stroke-width="2"/>

  <!-- R_base -->
  <line x1="100" y1="360" x2="330" y2="360" stroke="#333" stroke-width="2"/>
  <rect x="150" y="340" width="60" height="40" fill="none" stroke="#333" stroke-width="2"/>
  <text x="155" y="335" font-size="14" font-weight="bold">R2 = 1кОм</text>
  <text x="335" y="350" font-size="12">база (б)</text>

  <!-- ESP32 pin -->
  <rect x="30" y="335" width="12" height="50" fill="#8e44ad"/>
  <text x="0" y="320" font-size="14" font-weight="bold" fill="#8e44ad">ESP32</text>
  <text x="15" y="410" font-size="13" fill="#8e44ad">GPIO25</text>
  <text x="15" y="428" font-size="12" fill="#8e44ad">(ШИМ ~20кГц)</text>

  <!-- Notes -->
  <rect x="80" y="450" width="620" height="90" fill="#fff8e1" stroke="#f39c12" stroke-width="1"/>
  <text x="95" y="475" font-size="13" font-weight="bold" fill="#c07800">Порядок пайки:</text>
  <text x="95" y="495" font-size="13" fill="#333">1. Эмиттер VT1 -&gt; GND.  2. База VT1 -&gt; R2 -&gt; GPIO25.</text>
  <text x="95" y="513" font-size="13" fill="#333">3. Коллектор VT1 -&gt; узел OUT (туда же R1 сверху к +5В, C1 вниз к GND, и провод к контроллеру).</text>
  <text x="95" y="531" font-size="13" fill="#333">Полярность C1: "минус" (полоска на корпусе) — в сторону GND, не перепутай.</text>

  <text x="30" y="600" font-size="13" fill="#555">Логика ПЕРЕВЁРНУТАЯ: чем больше ШИМ-заполнение (duty) на GPIO25 — тем СИЛЬНЕЕ открыт VT1 — тем БЛИЖЕ узел OUT к земле (меньше газ).</text>
  <text x="30" y="618" font-size="13" fill="#555">Прошивка уже это учитывает (инвертирует), можно не думать при пайке — просто повторить схему как нарисовано.</text>
</svg>
