<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><style>text{font-family:Arial,sans-serif;fill:#243447}.title{font-size:22px;font-weight:bold}.sub{font-size:13px;fill:#667085}.head{font-size:17px;font-weight:bold;fill:#1d4ed8}.box{fill:#f8fafc;stroke:#2563eb;stroke-width:2}.actual{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}.line{stroke:#2563eb;stroke-width:3}</style><rect width="1100" height="760" fill="#fff"/><text x="30" y="36" class="title">План: датчик Холла мотора для скорости и пробега</text><text x="30" y="61" class="sub">Один импульсный сигнал достаточен для частоты и счётчика; GPIO35 — резервный вход (предложение)</text><rect x="60" y="150" width="250" height="190" class="box" rx="8"/><text x="90" y="195" class="head">Мотор / контроллер</text><text x="90" y="235">+5V -> питание Холлов</text><text x="90" y="270">GND -> общий минус</text><text x="90" y="305">HALL A -> сигнал</text><path d="M310 280h120" class="line"/><rect x="430" y="220" width="170" height="120" class="box" rx="8"/><text x="465" y="260" class="head">Делитель</text><text x="465" y="295">R1 10к / R2 20к</text><path d="M600 280h130" class="line"/><rect x="730" y="190" width="280" height="180" class="actual" rx="8"/><text x="770" y="235" class="head">ESP32 GPIO35</text><text x="770" y="275">INPUT, внешняя</text><text x="770" y="305">подтяжка к 3.3V</text><text x="770" y="340">ISR -> скорость/пробег</text><rect x="60" y="450" width="950" height="120" class="warn" rx="8"/><text x="85" y="485">Расчёт: скорость = частота импульсов × расстояние на импульс.</text><text x="85" y="515">Нужны окружность колеса, импульсов на оборот и передаточное число. Один Hall не определяет направление.</text><text x="85" y="545">У редукторного мотора возможен фривил: накат может не давать импульсов; предпочтителен отдельный wheel-speed датчик.</text></svg>