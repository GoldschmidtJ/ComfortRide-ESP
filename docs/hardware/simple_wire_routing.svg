<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><style>text{font-family:Arial,sans-serif;fill:#243447}.title{font-size:22px;font-weight:bold}.sub{font-size:13px;fill:#667085}.head{font-size:17px;font-weight:bold;fill:#1d4ed8}.box{fill:#f8fafc;stroke:#2563eb;stroke-width:2}.actual{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}.line{stroke:#2563eb;stroke-width:3}.gnd{stroke:#111827;stroke-width:3}</style><rect width="1100" height="650" fill="#fff"/><text x="30" y="36" class="title">Монтаж газа — актуальная упрощённая маршрутизация</text><text x="30" y="61" class="sub">Сигнал ручки и сигнал контроллера проходят через плату и никогда не соединяются напрямую</text><rect x="50" y="150" width="220" height="150" class="box" rx="8"/><text x="80" y="195" class="head">Ручка газа</text><text x="80" y="235">+5V / GND / SIGNAL</text><path d="M270 225h170" class="line"/><text x="300" y="210">SIGNAL IN</text><rect x="440" y="130" width="250" height="200" class="actual" rx="8"/><text x="480" y="175" class="head">ESP32 + MCP6002</text><text x="480" y="220">ADC GPIO34 читает</text><text x="480" y="255">DAC GPIO25 формирует</text><path d="M690 225h170" class="line"/><text x="720" y="210">SIGNAL OUT</text><rect x="860" y="150" width="200" height="150" class="box" rx="8"/><text x="895" y="195" class="head">Контроллер</text><text x="895" y="235">вход газа &lt;- OUT</text><path d="M160 300v190h800v-190" class="gnd"/><text x="70" y="520">Общий GND</text><rect x="50" y="570" width="1010" height="60" class="warn" rx="8"/><text x="70" y="607">Проверить уровни и общий GND перед включением. Подробности — full_schematic_mcp6002.svg.</text></svg>