<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><style>text{font-family:Arial,sans-serif;fill:#243447}.title{font-size:22px;font-weight:bold}.sub{font-size:13px;fill:#667085}.head{font-size:17px;font-weight:bold;fill:#1d4ed8}.box{fill:#f8fafc;stroke:#2563eb;stroke-width:2}.actual{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}.line{stroke:#2563eb;stroke-width:3}</style><rect width="1100" height="760" fill="#fff"/><text x="30" y="36" class="title">План: пассивный сниффер шины дисплея</text><text x="30" y="61" class="sub">Подключать параллельно штатному дисплею только как RX-only; протокол и уровень сначала определить измерением</text><rect x="60" y="160" width="250" height="170" class="box" rx="8"/><text x="90" y="205" class="head">Контроллер KT</text><text x="90" y="245">линия display / 1-wire</text><text x="90" y="285">штатный дисплей остаётся</text><path d="M310 245h120" class="line"/><rect x="430" y="185" width="170" height="120" class="box" rx="8"/><text x="465" y="225" class="head">Делитель</text><text x="465" y="260">если линия 5V</text><path d="M600 245h130" class="line"/><rect x="730" y="160" width="280" height="170" class="actual" rx="8"/><text x="770" y="205" class="head">ESP32 GPIO36</text><text x="770" y="245">цифровой вход RX-only</text><text x="770" y="280">не передавать сигнал</text><text x="770" y="315">захват фронтов CHANGE</text><rect x="60" y="420" width="950" height="155" class="warn" rx="8"/><text x="85" y="455">Сначала мультиметром и логическим анализатором определить: UART или настоящая 1-wire half-duplex шина,</text><text x="85" y="485">уровень 3.3/5V, скорость и формат кадров. Не подключать GPIO напрямую к неизвестному 5V сигналу.</text><text x="85" y="525">GPIO36 уже поддерживается пассивным сниффером /debug; штатный дисплей не отключать.</text></svg>