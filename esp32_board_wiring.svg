<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" font-family="Arial, sans-serif">
  <rect width="1000" height="820" fill="#ffffff"/>
  <text x="30" y="30" font-size="20" font-weight="bold">ESP32 DevKit — распиновка и подключаемая периферия (актуально: ОУ MCP6002)</text>
  <text x="30" y="52" font-size="12" fill="#888">Общий вид типовой 30-пиновой платы. Точное расположение может отличаться на твоей — сверим по фото, когда придёт.</text>

  <!-- Board outline -->
  <rect x="380" y="90" width="140" height="620" rx="8" fill="#1a3a1a" stroke="#0a1a0a" stroke-width="2"/>
  <rect x="420" y="90" width="60" height="30" fill="#888" stroke="#555"/>
  <text x="425" y="110" font-size="11" fill="#fff">USB</text>
  <text x="400" y="720" font-size="12" fill="#fff" font-weight="bold">ESP32 DevKit</text>

  <!-- LEFT COLUMN PINS -->
  <line x1="380" y1="140" x2="330" y2="140" stroke="#333" stroke-width="2"/>
  <text x="330" y="135" font-size="12" text-anchor="end">3V3</text>
  <line x1="380" y1="165" x2="330" y2="165" stroke="#333" stroke-width="2"/>
  <text x="330" y="160" font-size="12" text-anchor="end">GND</text>
  <line x1="380" y1="220" x2="150" y2="220" stroke="#2980b9" stroke-width="2"/>
  <text x="335" y="215" font-size="13" font-weight="bold" fill="#2980b9" text-anchor="end">GPIO34</text>
  <line x1="380" y1="280" x2="150" y2="280" stroke="#c0392b" stroke-width="2"/>
  <text x="335" y="275" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="end">GPIO25</text>
  <line x1="380" y1="340" x2="150" y2="340" stroke="#8e44ad" stroke-width="2"/>
  <text x="335" y="335" font-size="13" font-weight="bold" fill="#8e44ad" text-anchor="end">GPIO27</text>
  <line x1="380" y1="400" x2="150" y2="400" stroke="#27ae60" stroke-width="2"/>
  <text x="335" y="395" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="end">GPIO14</text>
  <line x1="380" y1="460" x2="150" y2="460" stroke="#f39c12" stroke-width="2"/>
  <text x="335" y="455" font-size="13" font-weight="bold" fill="#f39c12" text-anchor="end">GPIO13</text>
  <line x1="380" y1="500" x2="345" y2="500" stroke="#888" stroke-width="1"/>
  <line x1="380" y1="530" x2="345" y2="530" stroke="#888" stroke-width="1"/>
  <text x="330" y="500" font-size="10" fill="#aaa" text-anchor="end">не используем</text>

  <!-- VIN/5V pin -->
  <line x1="380" y1="650" x2="330" y2="650" stroke="#c0392b" stroke-width="2"/>
  <text x="330" y="645" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">5V / VIN</text>

  <!-- RIGHT COLUMN — свободно -->
  <line x1="520" y1="180" x2="560" y2="180" stroke="#888" stroke-width="1"/>
  <line x1="520" y1="220" x2="560" y2="220" stroke="#888" stroke-width="1"/>
  <line x1="520" y1="260" x2="560" y2="260" stroke="#888" stroke-width="1"/>
  <text x="565" y="230" font-size="11" fill="#aaa">свободные пины</text>
  <text x="565" y="245" font-size="11" fill="#aaa">(под следующие</text>
  <text x="565" y="260" font-size="11" fill="#aaa">устройства)</text>

  <!-- Ручка газа -->
  <rect x="20" y="195" width="130" height="55" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
  <text x="30" y="213" font-size="12" font-weight="bold" fill="#2980b9">Ручка газа</text>
  <text x="30" y="228" font-size="10" fill="#2980b9">сигнал -&gt; делитель ->
  </text>
  <text x="30" y="242" font-size="10" fill="#2980b9">буфер ОУ -&gt; GPIO34</text>

  <!-- Выход газа -->
  <rect x="20" y="255" width="130" height="55" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="30" y="273" font-size="12" font-weight="bold" fill="#c0392b">Выход газа</text>
  <text x="30" y="288" font-size="10" fill="#c0392b">GPIO25 -&gt; ОУ (x1.27) -&gt;</text>
  <text x="30" y="302" font-size="10" fill="#c0392b">вход контроллера</text>

  <!-- Тормоз -->
  <rect x="20" y="315" width="130" height="55" fill="#f3eaf8" stroke="#8e44ad" stroke-width="2"/>
  <text x="30" y="333" font-size="12" font-weight="bold" fill="#8e44ad">Тормоз</text>
  <text x="30" y="348" font-size="10" fill="#8e44ad">2 провода, один -&gt; GND,</text>
  <text x="30" y="362" font-size="10" fill="#8e44ad">второй -&gt; GPIO27</text>

  <!-- PAS -->
  <rect x="20" y="375" width="130" height="65" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="30" y="393" font-size="12" font-weight="bold" fill="#27ae60">PAS-датчик</text>
  <text x="30" y="408" font-size="10" fill="#27ae60">GND, +5В (свои!),</text>
  <text x="30" y="422" font-size="10" fill="#27ae60">сигнал -&gt; GPIO14</text>
  <text x="30" y="435" font-size="10" fill="#27ae60">(подтяжка внутр. ESP32)</text>

  <!-- Кнопка -->
  <rect x="20" y="435" width="130" height="55" fill="#fff8e1" stroke="#f39c12" stroke-width="2"/>
  <text x="30" y="453" font-size="12" font-weight="bold" fill="#f39c12">Кнопка PAS</text>
  <text x="30" y="468" font-size="10" fill="#f39c12">один контакт -&gt; GND,</text>
  <text x="30" y="482" font-size="10" fill="#f39c12">второй -&gt; GPIO13</text>

  <!-- Питание платы -->
  <rect x="20" y="625" width="130" height="55" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="30" y="643" font-size="12" font-weight="bold" fill="#c0392b">Питание платы</text>
  <text x="30" y="658" font-size="10" fill="#c0392b">от понижайки, 5В -&gt;</text>
  <text x="30" y="672" font-size="10" fill="#c0392b">GND + 5V/VIN</text>

  <!-- MCP6002 -->
  <rect x="600" y="380" width="360" height="220" fill="#fdf2e9" stroke="#c0392b" stroke-width="2" rx="6"/>
  <text x="615" y="405" font-size="14" font-weight="bold" fill="#c0392b">MCP6002 (детально — отдельная схема)</text>
  <text x="615" y="425" font-size="12" fill="#333">Канал А: делитель (R1 10к, R2 24к) -&gt; IN+ A (пин3)</text>
  <text x="615" y="443" font-size="12" fill="#333">OUT A (пин1) -&gt; IN- A (пин2), буфер x1</text>
  <text x="615" y="461" font-size="12" fill="#333">OUT A (пин1) -&gt; GPIO34</text>
  <text x="615" y="479" font-size="12" fill="#333">Канал Б: GPIO25 -&gt; IN+ B (пин5)</text>
  <text x="615" y="497" font-size="12" fill="#333">R3(10к)/R4(2.7к) на IN- B -&gt; усиление x1.27</text>
  <text x="615" y="515" font-size="12" fill="#333">OUT B (пин7) -&gt; вход газа контроллера</text>
  <text x="615" y="533" font-size="12" fill="#333">Vdd(8)-&gt;+5В, Vss(4)-&gt;GND, C 0.1мкФ рядом</text>
  <text x="615" y="558" font-size="11" fill="#888">(полная схема — full_schematic_mcp6002.svg)</text>

  <text x="30" y="760" font-size="12" fill="#555">Общий GND один на всех: ESP32, MCP6002, контроллер, датчики, аккумулятор минус.</text>
  <text x="30" y="778" font-size="12" fill="#555">Если ручка газа заработает от 3.3В — делитель (R1/R2) можно не ставить, кормить сигнал прямо в IN+ A.</text>
</svg>
