<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><style>text{font-family:Arial,sans-serif;fill:#243447}.title{font-size:22px;font-weight:bold}.sub{font-size:13px;fill:#667085}.head{font-size:17px;font-weight:bold;fill:#1d4ed8}.box{fill:#f8fafc;stroke:#2563eb;stroke-width:2}.actual{fill:#ecfdf5;stroke:#059669;stroke-width:2}.arch{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}.line{stroke:#2563eb;stroke-width:3}.power{stroke:#ea580c;stroke-width:3}.gnd{stroke:#111827;stroke-width:3}.signal{stroke:#7c3aed;stroke-width:3}</style><rect width="1100" height="760" fill="#fff"/><text x="30" y="36" class="title">ESP32 DevKit — актуальная распиновка ComfortRide</text><text x="30" y="61" class="sub">Источник истины: src/main.cpp • GPIO35/36 — только предлагаемые будущие входы</text><rect x="430" y="100" width="220" height="510" rx="12" fill="#163b2f" stroke="#0b241c" stroke-width="3"/><text x="480" y="145" fill="#fff" font-size="18" font-weight="bold">ESP32 DevKit</text><g class="head"><text x="70" y="125">GPIO34 — ADC: вход газа</text><text x="70" y="175">GPIO25 — DAC: выход газа</text><text x="70" y="225">GPIO27 — тормоз</text><text x="70" y="275">GPIO14 — PAS</text><text x="70" y="325">GPIO13 — кнопка PAS</text><text x="70" y="375">GPIO18 / 19 — фара / ДХО</text><text x="70" y="425">GPIO21 / 22 — поворотники Л / П</text><text x="70" y="475">GPIO23 / 4 — гудок / пищалка</text><text x="70" y="525">GPIO16 / 17 / 32 / 33 — кнопки</text></g><g class="head"><text x="700" y="125">GPIO35 — план: Hall</text><text x="700" y="175">GPIO36 — план: display RX</text><text x="700" y="225">5V / VIN — питание платы</text><text x="700" y="275">GND — общий минус</text></g><rect x="50" y="630" width="1000" height="80" class="warn" rx="8"/><text x="70" y="660">GPIO ESP32 не толерантны к 5 В. Сигналы Холла и шины дисплея измерить; при 5 В применить делитель.</text><text x="70" y="685">GPIO35/36 не имеют внутренней подтяжки: для открытого коллектора нужна внешняя подтяжка к 3.3 В.</text></svg>