<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><style>text{font-family:Arial,sans-serif;fill:#243447}.title{font-size:22px;font-weight:bold}.sub{font-size:13px;fill:#667085}.head{font-size:17px;font-weight:bold;fill:#1d4ed8}.box{fill:#f8fafc;stroke:#2563eb;stroke-width:2}.actual{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}.line{stroke:#2563eb;stroke-width:3}.power{stroke:#ea580c;stroke-width:3}.gnd{stroke:#111827;stroke-width:3}</style><rect width="1100" height="760" fill="#fff"/><text x="30" y="36" class="title">Актуальная схема throttle-by-wire: ESP32 + MCP6002</text><text x="30" y="61" class="sub">Канал A — буфер входа ручки; канал B — усиление DAC до диапазона контроллера</text><rect x="430" y="160" width="240" height="350" rx="10" class="actual"/><text x="490" y="205" class="head">MCP6002</text><text x="455" y="245">1 OUT A / 2 IN&#8722; A / 3 IN+ A</text><text x="455" y="285">4 VSS = GND</text><text x="455" y="335">5 IN+ B / 6 IN&#8722; B</text><text x="455" y="375">7 OUT B / 8 VDD = +5V</text><text x="455" y="425">C = 100 нФ у питания</text><path d="M80 260h100" class="line"/><rect x="180" y="240" width="70" height="40" class="box"/><text x="190" y="232">R1 10к</text><path d="M250 260h180M250 260v80" class="line"/><rect x="230" y="340" width="40" height="70" class="box"/><text x="280" y="380">R2 24к</text><path d="M250 410v100h180" class="gnd"/><text x="80" y="220" class="head">Ручка газа 0–4.2V</text><text x="80" y="300">OUT A → GPIO34 (ADC)</text><path d="M80 500h350v-70" class="line"/><text x="80" y="480" class="head">GPIO25 (DAC 0–3.3V)</text><path d="M670 335h110v-70h100" class="line"/><rect x="780" y="205" width="70" height="40" class="box"/><text x="785" y="197">R4 2.7к</text><path d="M780 245v90h-110" class="line"/><rect x="750" y="365" width="70" height="40" class="box"/><text x="755" y="357">R3 10к</text><path d="M785 405v105h-115" class="gnd"/><path d="M880 195h160" class="power"/><text x="880" y="180" class="head">OUT B → контроллер 0–4.2V</text><path d="M550 510v70M550 110v50" class="gnd"/><text x="505" y="100">+5V</text><text x="470" y="620">Общий GND: ESP32, MCP6002 и моторконтроллер</text><rect x="40" y="650" width="1010" height="55" class="warn" rx="6"/><text x="60" y="683">outMinV/outMaxV задаются через веб-интерфейс. Перед пайкой проверить диапазон входа контроллера.</text></svg>