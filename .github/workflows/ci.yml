name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO Core
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Check for build warnings in src/
        run: |
          if grep -iE 'warning' .pio/build/esp32dev/*.log 2>/dev/null; then
            echo "::warning::Обнаружены предупреждения компиляции"
          fi
