<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><style>text{font-family:Arial,sans-serif;fill:#243447}.title{font-size:22px;font-weight:bold}.sub{font-size:13px;fill:#667085}.head{font-size:17px;font-weight:bold;fill:#1d4ed8}.box{fill:#f8fafc;stroke:#2563eb;stroke-width:2}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}.power{stroke:#ea580c;stroke-width:3}.gnd{stroke:#111827;stroke-width:3}</style><rect width="1100" height="760" fill="#fff"/><text x="30" y="36" class="title">Свет и звук — low-side MOSFET</text><text x="30" y="61" class="sub">Актуальные GPIO: 18, 19, 21, 22, 23, 4 • задний 48V-блок не подключать</text><line x1="70" y1="105" x2="1030" y2="105" class="power"/><text x="40" y="111">+12V только для подтверждённых нагрузок</text><line x1="70" y1="610" x2="1030" y2="610" class="gnd"/><text x="40" y="616">GND</text><rect x="70" y="180" width="165" height="250" class="box" rx="8"/><text x="90" y="220" class="head">Фара</text><text x="90" y="260">AOD418 low-side</text><text x="90" y="300">gate &#8592; GPIO18</text><text x="90" y="340">ШИМ</text><line x1="152" y1="105" x2="152" y2="180" class="power"/><line x1="152" y1="430" x2="152" y2="610" class="gnd"/><rect x="270" y="180" width="165" height="250" class="box" rx="8"/><text x="290" y="220" class="head">ДХО</text><text x="290" y="260">AOD418 low-side</text><text x="290" y="300">gate &#8592; GPIO19</text><text x="290" y="340">ШИМ</text><line x1="352" y1="105" x2="352" y2="180" class="power"/><line x1="352" y1="430" x2="352" y2="610" class="gnd"/><rect x="470" y="180" width="165" height="250" class="box" rx="8"/><text x="490" y="220" class="head">Поворотники</text><text x="490" y="260">Л &#8592; GPIO21</text><text x="490" y="295">П &#8594; GPIO22</text><text x="490" y="335">мигание без ШИМ</text><line x1="552" y1="105" x2="552" y2="180" class="power"/><line x1="552" y1="430" x2="552" y2="610" class="gnd"/><rect x="670" y="180" width="165" height="250" class="box" rx="8"/><text x="690" y="220" class="head">Гудок</text><text x="690" y="260">AOD418 low-side</text><text x="690" y="300">gate &#8592; GPIO23</text><text x="690" y="340">вкл/выкл</text><line x1="752" y1="105" x2="752" y2="180" class="power"/><line x1="752" y1="430" x2="752" y2="610" class="gnd"/><rect x="870" y="180" width="165" height="250" class="box" rx="8"/><text x="890" y="220" class="head">Пищалка</text><text x="890" y="260">AOD418 low-side</text><text x="890" y="300">gate &#8592; GPIO4</text><text x="890" y="340">тик поворотника</text><line x1="952" y1="105" x2="952" y2="180" class="power"/><line x1="952" y1="430" x2="952" y2="610" class="gnd"/><rect x="70" y="665" width="960" height="45" class="warn" rx="6"/><text x="90" y="694">Проверить распиновку корпуса AOD418, ток нагрузки, защиту затвора и общий GND.</text></svg>