<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><style>text{font-family:Arial,sans-serif;fill:#243447}.title{font-size:22px;font-weight:bold}.sub{font-size:13px;fill:#667085}.head{font-size:17px;font-weight:bold;fill:#1d4ed8}.arch{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}</style><rect width="1100" height="620" fill="#fff"/><text x="30" y="36" class="title">АРХИВ: раннее согласование напряжений газа</text><text x="30" y="61" class="sub">Справочная схема; текущий монтаж описан в full_schematic_mcp6002.svg</text><rect x="70" y="140" width="960" height="300" class="arch" rx="10"/><text x="105" y="190" class="head">Вход: R1 10к / R2 24к -> GPIO34</text><text x="105" y="240">Выход: старый LM358 / усилитель -> вход контроллера.</text><text x="105" y="300">Актуальный вариант: MCP6002 питается от +5V, DAC GPIO25 усиливается.</text><text x="105" y="350">Диапазоны min/max измерять мультиметром, не считать универсальными.</text><rect x="70" y="490" width="960" height="70" class="warn" rx="8"/><text x="95" y="530">Все GPIO ESP32 защищать от 5V; использовать делитель там, где требуется.</text></svg>